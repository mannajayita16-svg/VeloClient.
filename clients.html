<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Clients | VeloClient</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="app-page">

<div class="app-layout">

  <aside class="sidebar">

    <a href="dashboard.html" class="brand">
      <span class="brand-mark">V</span>
      VeloClient
    </a>

    <nav class="side-nav">
      <a href="dashboard.html">◉ Dashboard</a>
      <a class="active" href="clients.html">◌ Clients</a>
      <a href="clients.html">□ Intake Forms</a>
      <a href="audit.html">✦ AI Audits</a>
      <a href="settings.html">⚙ Settings</a>
    </nav>

    <div class="side-bottom">
      <button id="logout" class="logout">Sign out</button>
    </div>

  </aside>

  <main class="app-main">

    <header class="app-header">
      <div>
        <small>CLIENT MANAGEMENT</small>
        <h1>Clients</h1>
      </div>

      <button id="openModal" class="btn">+ Add Client</button>
    </header>

    <div id="clientsGrid" class="clients-grid"></div>

  </main>

</div>

<div id="clientModal" class="modal hidden">

  <div class="modal-card">

    <button id="closeModal" class="modal-close">×</button>

    <span class="eyebrow">NEW CLIENT</span>
    <h2>Add a client</h2>
    <p class="muted">Create a workspace for a new client.</p>

    <form id="clientForm">

      <label>Client name</label>
      <input id="clientName" required placeholder="Acme Creative">

      <label>Company email</label>
      <input id="clientEmail" type="email" placeholder="hello@acme.com">

      <label>Project</label>
      <input id="clientProject" placeholder="Website redesign">

      <label>Status</label>
      <select id="clientStatus">
        <option value="not_started">Not Started</option>
        <option value="in_progress">In Progress</option>
        <option value="completed">Completed</option>
      </select>

      <button class="btn full" type="submit">Create Client</button>

      <p id="clientMessage" class="form-message"></p>

    </form>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>

</body>
</html>
