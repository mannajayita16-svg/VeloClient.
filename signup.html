<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Create account | VeloClient</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

<div class="auth-shell">

  <a href="index.html" class="brand auth-brand">
    <span class="brand-mark">V</span>
    VeloClient
  </a>

  <div class="auth-card">

    <div class="auth-heading">
      <span class="eyebrow">START YOUR WORKSPACE</span>
      <h1>Create your account</h1>
      <p>Your agency workspace follows you across devices.</p>
    </div>

    <form id="signupForm">

      <label>Full name</label>
      <input id="name" type="text" placeholder="Your name" required>

      <label>Agency name</label>
      <input id="agency" type="text" placeholder="Your agency" required>

      <label>Email</label>
      <input id="email" type="email" placeholder="you@agency.com" required>

      <label>Password</label>
      <input id="password" type="password" minlength="8" placeholder="Minimum 8 characters" required>

      <button class="btn full" type="submit">Create Account →</button>

      <p id="message" class="form-message"></p>

    </form>

    <div class="auth-bottom">
      Already have an account?
      <a href="login.html">Sign in</a>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
